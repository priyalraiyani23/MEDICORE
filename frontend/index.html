<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>MEDICORE — Excellence In Healthcare</title>
    <meta name="description" content="MEDICORE is a comprehensive healthcare platform offering online doctor appointments, medical records, AI-powered health assistance, lab reports, and pharmacy services in one place." />
    <meta name="keywords" content="medicore, online doctor appointment, healthcare, medical records, AI health, pharmacy, lab reports, book doctor" />
    <meta name="author" content="MEDICORE Healthcare Solutions" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://medicore.care/" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MEDICORE — Excellence In Healthcare" />
    <meta property="og:description" content="Book doctor appointments, manage medical records, and access AI-powered health services with MEDICORE." />
    <meta property="og:url" content="https://medicore.care/" />
    <meta property="og:site_name" content="MEDICORE" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MEDICORE — Excellence In Healthcare" />
    <meta name="twitter:description" content="Book doctor appointments, manage medical records, and access AI-powered health services with MEDICORE." />

    <!-- Security / Best Practices -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#3d5a80" />

    <!-- Preconnect to Google Fonts (performance: start DNS+TCP early) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking Google Fonts (print trick: loads after render) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
